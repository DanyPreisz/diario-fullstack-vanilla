<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diario</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="shell">
    <section id="auth-view" class="auth card">
      <p class="eyebrow">Diario personal</p>
      <h1>Hoy</h1>
      <div class="tabs">
        <button class="tab active" type="button" data-mode="login">Entrar</button>
        <button class="tab" type="button" data-mode="register">Crear cuenta</button>
      </div>
      <form id="auth-form">
        <label>Usuario <input name="username" required minlength="3" maxlength="20" autocomplete="username" /></label>
        <label>Contrasena <input name="password" type="password" required minlength="6" autocomplete="current-password" /></label>
        <p id="auth-error" class="error" hidden></p>
        <button id="auth-submit" class="primary" type="submit">Entrar</button>
      </form>
    </section>
    <section id="app-view" class="hidden">
      <header>
        <div><p class="eyebrow">Vanilla JS · Mongo</p><h1>Diario</h1></div>
        <div class="who"><strong id="user-name"></strong><button id="logout" class="ghost" type="button">Salir</button></div>
      </header>
      <form id="entry-form" class="card form">
        <input id="day" type="date" required />
        <input id="title" placeholder="Titulo" maxlength="80" />
        <select id="mood"><option value="">Animo</option><option value="bien">Bien</option><option value="normal">Normal</option><option value="mal">Mal</option></select>
        <textarea id="body" placeholder="Que paso hoy" maxlength="4000" required></textarea>
        <p id="form-error" class="error" hidden></p>
        <div class="row"><button class="primary" type="submit">Guardar dia</button><button id="remove" class="danger" type="button" hidden>Borrar</button></div>
      </form>
      <input id="search" type="search" placeholder="Buscar en el diario" />
      <ul id="list"></ul>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
